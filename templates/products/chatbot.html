<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ChatBot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            font-size: 26px;
            font-weight: bold;
            color: #0078d7;
            text-align: center;
            padding: 15px;
            border-bottom: 2px solid #0078d7;
        }

        .chat-container {
            flex: 1; /* take available space */
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 20px;
            max-width: 70%;
            font-size: 14px;
            line-height: 1.4;
        }

        .user-message {
            background: #0078d7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: #e6e6e6;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ccc;
            background: #fff;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .input-area button {
            margin-left: 10px;
            padding: 10px 16px;
            background: #0078d7;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>
    <header>ChatBot</header>

    <div class="chat-container">
        {% for msg in messages %}
            <div class="message user-message">{{ msg.user_input }}</div>
            <div class="message bot-message">{{ msg.text_output }}</div>
        {% endfor %}

        {% if user_input %}
            <div class="message user-message">{{ user_input }}</div>
            <div class="message bot-message">{{ text_output }}</div>
        {% endif %}
    </div>

    <form method="POST" enctype="multipart/form-data" class="input-area">
        {% csrf_token %}
        <input type="text" name="user_input" placeholder="Type your question...">
        <button type="submit">Send</button>
    </form>
</body>
</html>
