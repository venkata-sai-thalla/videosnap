{% block content %}
  <h2>Your Cart</h2>
  <div class="cart-container">
    {% if cart_items %}
      <ul>
        {% for item in cart_items %}
          <li>
            {{ item.product.name }} — ₹{{ item.product.price }}
            <span>Qty: {{ item.quantity }}</span>
          </li>
        {% endfor %}
      </ul>
      <p><strong>Total:</strong> ₹{{ total }}</p>
    {% else %}
      <p>Your cart is empty.</p>
    {% endif %}
  </div>
{% endblock %}
